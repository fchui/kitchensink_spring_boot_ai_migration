# Keep the original URLs: /kitchensink, /kitchensink/rest/members
server.servlet.context-path=/kitchensink

# In-memory H2 database (development only), recreated on startup and seeded from import.sql
spring.datasource.url=jdbc:h2:mem:kitchensink;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# UI texts in English, Spanish and French, picked from the browser's Accept-Language
spring.messages.basename=org/spring/quickstarts/kitchensink/bundle/Resources
spring.messages.fallback-to-system-locale=false

# Keep session ids out of URLs (flash messages after registration use the session)
server.servlet.session.tracking-modes=cookie
