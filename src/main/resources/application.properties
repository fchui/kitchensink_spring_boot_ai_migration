# Keep the original URLs: /kitchensink, /kitchensink/rest/members
server.servlet.context-path=/kitchensink

# MongoDB connection; set MONGODB_URI to use another server, credentials or database
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/kitchensink}
# Create the unique index on members.email from the @Indexed annotation (off by default in Spring Data)
spring.data.mongodb.auto-index-creation=true
# MongoDB version for the embedded server used by the tests and mvn spring-boot:test-run (ignored by the app itself)
de.flapdoodle.mongodb.embedded.version=8.0.23
logging.level.de.flapdoodle.embed.mongo=WARN

# UI texts in English, Spanish and French, picked from the browser's Accept-Language
spring.messages.basename=org/spring/quickstarts/kitchensink/bundle/Resources
spring.messages.fallback-to-system-locale=false

# Keep session ids out of URLs (flash messages after registration use the session)
server.servlet.session.tracking-modes=cookie
