<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, memberList)" th:lang="${#locale.language}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kitchensink</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
    <header class="site-header">
        <div class="wrap">
            <a class="brand" th:href="@{/}">kitchensink</a>
        </div>
    </header>

    <div class="wrap layout">
        <main th:replace="${content}">Page content</main>

        <aside class="sidebar">
            <p th:text="#{learnAboutSpringBoot}">Learn more about Spring Boot.</p>
            <ul>
                <li><a href="https://docs.spring.io/spring-boot/" th:text="#{documentation}">Documentation</a></li>
                <li><a href="https://spring.io/projects/spring-boot" th:text="#{projectPage}">Project Page</a></li>
            </ul>
        </aside>
    </div>

    <section th:replace="${memberList}">Member list</section>

    <footer class="site-footer">
        <div class="wrap">
            <p th:text="#{projectFooter}">This project is based on the kitchensink sample application.</p>
        </div>
    </footer>
</body>
</html>
