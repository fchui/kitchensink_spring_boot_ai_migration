<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">
<body>
<main class="content">
    <h1 th:text="#{errorHeader}">Something went wrong</h1>
    <p class="lead" th:text="#{errorMessage}">The page could not be shown. Please try again later.</p>
    <p class="hint" th:if="${status}" th:text="|HTTP ${status}|">HTTP 500</p>
    <p><a class="button" th:href="@{/}" th:text="#{backToRegistration}">Back to registration</a></p>
</main>
</body>
</html>
