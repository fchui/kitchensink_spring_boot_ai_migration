<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>kitchensink</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" th:href="@{/resources/css/screen.css}" />
</head>
<body>
    <div id="container">
        <div id="content">
            <h1 th:text="#{memberWelcomeHeader}">Welcome</h1>
            <div>
                <p th:text="#{memberWelcomeMessage}"></p>
            </div>

            <form id="reg" method="post" th:action="@{/}" th:object="${newMember}">
                <h2 th:text="#{memberRegistrationHeader}">Member Registration</h2>
                <p th:text="#{memberFormDescription}"></p>
                <table>
                    <tr>
                        <td class="titleCell"><label for="name" th:text="#{memberNameLabel}">Name:</label></td>
                        <td><input type="text" id="name" th:field="*{name}" /></td>
                        <td><span class="invalid" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span></td>
                    </tr>
                    <tr>
                        <td class="titleCell"><label for="email" th:text="#{memberEmailLabel}">Email:</label></td>
                        <td><input type="text" id="email" th:field="*{email}" /></td>
                        <td><span class="invalid" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span></td>
                    </tr>
                    <tr>
                        <td class="titleCell"><label for="phoneNumber" th:text="#{memberPhoneLabel}">Phone #:</label></td>
                        <td><input type="text" id="phoneNumber" th:field="*{phoneNumber}" /></td>
                        <td><span class="invalid" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></span></td>
                    </tr>
                </table>
                <table>
                    <tr>
                        <td><input type="submit" id="register" class="register" th:value="#{memberRegisterButtonLabel}" /></td>
                        <td>
                            <ul class="messages" th:if="${successMessage != null or errorMessage != null}">
                                <li class="valid" th:if="${successMessage != null}" th:text="${successMessage}"></li>
                                <li class="invalid" th:if="${errorMessage != null}" th:text="${errorMessage}"></li>
                            </ul>
                        </td>
                    </tr>
                </table>
            </form>

            <h2 th:text="#{membersHeader}">Members</h2>
            <em th:if="${#lists.isEmpty(members)}">No registered members.</em>
            <table class="simpletablestyle" th:unless="${#lists.isEmpty(members)}">
                <thead>
                    <tr>
                        <th th:text="#{memberIdHeader}">ID</th>
                        <th th:text="#{memberNameHeader}">Name</th>
                        <th th:text="#{memberEmailHeader}">Email</th>
                        <th th:text="#{memberPhoneHeader}">Phone #</th>
                        <th th:text="#{memberRestUrl}">REST URL</th>
                    </tr>
                </thead>
                <tfoot>
                    <tr>
                        <td colspan="5">
                            <span th:text="#{memberRestUrlAllLabel}"></span><a th:href="@{/rest/members}">/rest/members</a>
                        </td>
                    </tr>
                </tfoot>
                <tbody>
                    <tr th:each="member : ${members}">
                        <td th:text="${member.id}"></td>
                        <td th:text="${member.name}"></td>
                        <td th:text="${member.email}"></td>
                        <td th:text="${member.phoneNumber}"></td>
                        <td><a th:href="@{/rest/members/{id}(id=${member.id})}" th:text="|/rest/members/${member.id}|"></a></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div id="aside">
            <p th:text="#{learnAboutSpringBoot}">Learn more about Spring Boot.</p>
            <ul>
                <li><a href="https://docs.spring.io/spring-boot/" th:text="#{documentation}">Documentation</a></li>
                <li><a href="https://spring.io/projects/spring-boot" th:text="#{projectPage}">Project Page</a></li>
            </ul>
        </div>
        <div id="footer">
            <p th:text="#{projectFooter}">This project is based on the kitchensink sample application.</p>
        </div>
    </div>
</body>
</html>
